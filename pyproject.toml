[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-economic-dashboard"
version = "1.0.0"
description = "Global Economic Intelligence Dashboard - PESTEL framework"
requires-python = ">=3.11"
authors = [{name = "Maxime NDACLEU"}]
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.1",
    "numpy>=1.26",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["core/__init__.py:__version__"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = ""
commit_message = "chore(release): bump version to {version} [skip ci]"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.changelog]
template_dir = ""
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge ",
    "^\\[skip ci\\]",
]

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs",
    "style", "test", "build", "ci", "chore", "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
