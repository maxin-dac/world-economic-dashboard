[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-economic-dashboard"
version = "3.0.2"
description = "Global Economic Intelligence Dashboard - PESTEL framework"
requires-python = ">=3.11"
authors = [{name = "Maxime NDACLEU"}]
license = {text = "MIT"}

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["core/__init__.py:__version__"]
commit_message = "chore(release): bump version to {version} [skip ci]"
tag_format = "v{version}"
build_command = ""
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
