[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "Segoe UI, sans-serif"

[server]
enableStaticServing = false
headless = true

[runner]
fastReruns = true
magicEnabled = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
